[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-cloud-solution-engineering-factory"
version = "0.2.0"
description = "Evidence-backed RFP-to-architecture, IaC and commercial proposal compiler"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[project.scripts]
solution-factory = "solution_factory.cli:main"
solution-qualify = "solution_factory.qualify_cli:main"

[tool.setuptools.packages.find]
include = ["solution_factory*"]
