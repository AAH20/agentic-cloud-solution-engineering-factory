name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m solution_factory.cli examples/vmware-to-azure-ai-platform.json --output generated
      - run: python -m solution_factory.private_inference_cli examples/private-inference-intake.json examples/private-inference-benchmark.synthetic.json --output generated/private-inference
      - uses: actions/upload-artifact@v6
        with:
          name: solution-evidence
          path: generated/
